[package]
name = "zbrain-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Command-line interface for zbrain."

[lints]
workspace = true

[[bin]]
name = "zbrain"
path = "src/main.rs"

[lib]
name = "zbrain_cli"
path = "src/lib.rs"

[dependencies]
zbrain-core = { path = "../zbrain-core", features = ["rerank", "embedding", "resolvers", "anthropic", "openai", "google"] }
zbrain-mcp = { path = "../zbrain-mcp" }
zbrain-web = { path = "../zbrain-web" }
clap = { version = "4", features = ["derive", "color"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
serde_yaml = "0.9"
anyhow = { workspace = true }
dirs = "5.0"
regex = "1"
reqwest = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
chrono = { workspace = true }

[features]
default = []
embedding = ["zbrain-core/embedding"]

[dev-dependencies]
tempfile = "3"
reqwest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
