[package]
name = "zbrain-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Core engine, types and operation contracts for zbrain."

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
sqlx = { workspace = true }
libsql = { workspace = true }
# Slice #110-h H1: only `tokio::sync::Mutex` (runtime-agnostic) is used in
# the lib — to serialize the *write* portion of `LibsqlEngine::init_schema`
# process-wide. Workspace tokio already enables `sync`. No `rt-*` features
# are pulled into the library, so callers stay free to pick any runtime.
# `macros` is needed by the resolver slices (tokio::select! / tokio::pin! in
# url_reachable); it does not pull an executor.
tokio = { workspace = true, features = ["process", "time", "macros"] }
# Slice 1-2-1 (Phase 9 worker contract): `CancellationToken` for the
# MinionJobContext cooperative-cancel signals (per-job `signal` + process
# `shutdown`). Only the `sync` feature — CancellationToken is runtime-agnostic
# (Arc<AtomicBool> + Notify): construct / cancel / is_cancelled need no
# executor. `.cancelled().await` (which does) is driven by the worker crate,
# not core — so this keeps zbrain-core's no-`rt-*` runtime neutrality intact.
tokio-util = { version = "0.7", default-features = false }
tracing = { workspace = true }
url = { workspace = true }
# Slice #41: Params validation. Lightweight trait-based validation with derive support.
garde = { workspace = true }
# Slice #41: Cross-platform path diffing for upload validation.
pathdiff = { workspace = true }
# Slice #58: Real LLM client for Think operation
reqwest = { workspace = true, optional = true }
# OAuth client management
uuid = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
rand = "0.8"
regex = "1"
serde_yaml = { workspace = true }
erased-serde = { workspace = true }
unicode-normalization = { workspace = true }
walkdir = "2"
# Slice 1-6-4-9 (publish command): self-contained shareable-HTML generation.
# AES-256-GCM content encryption + PBKDF2 (100k rounds, SHA-256) key derivation
# — wire-compatible with the TS `crypto` module so the in-browser decryptor
# (DECRYPT_JS) keeps working unchanged. `hmac` is the Mac backend for pbkdf2.
aes-gcm = "0.10"
pbkdf2 = "0.12"
hmac = "0.12"
# Server-side markdown -> HTML rendering (replaces the TS inlined marked.js),
# so published HTML is fully static with no client-side JS renderer.
pulldown-cmark = "0.12"
# ISO-8601 week-number math for the rerank-audit JSONL file rotation
# (`rerank-failures-YYYY-Www.jsonl`) and the doctor 7-day failure window.
# ISO week year-boundary rules (week 1 contains the first Thursday; a
# late-December date can belong to week 53 of the *previous* year) are
# error-prone to hand-roll, so we lean on chrono's `IsoWeek` + `%G-W%V`.
chrono = { workspace = true }
tar = "0.4"
flate2 = { version = "1.0", features = ["miniz_oxide"], default-features = false }
dirs = "5.0"
atty = "0.2"
semver = "1.0"
textwrap = "0.16"
lazy_static = "1.4"
zbrain-chunking = { path = "../zbrain-chunking" }

[features]
default = []
openai = ["dep:reqwest"]
# Real reqwest-backed native Anthropic Messages API chat provider. Mirrors the
# `openai` feature: the trait/mock/pure serializers are always compiled; only
# the live `/v1/messages` POST path needs reqwest.
anthropic = ["dep:reqwest"]
# Real reqwest-backed native Google Gemini generateContent chat provider.
# Mirrors the `openai`/`anthropic` features: the pure serializers/parser are
# always compiled; only the live `:generateContent` POST path needs reqwest.
google = ["dep:reqwest"]
embedding = ["dep:reqwest"]
# Real reqwest-backed cross-encoder rerank HTTP client. The mock client and
# the fail-open `apply_reranker` call-site logic are always compiled; only the
# live ZeroEntropy POST path needs reqwest.
rerank = ["dep:reqwest"]
# Resolver live transports: reqwest-backed HttpClient + tokio::net DNS
# resolver for url_reachable / x_api. The trait + Mock clients + the resolver
# logic are always compiled; only the live network paths need this feature.
resolvers = ["dep:reqwest", "tokio/net"]
# Skillpack subsystem registry client needs reqwest for network access.
skillpack = ["dep:reqwest"]

[dev-dependencies]
tokio = { workspace = true }
sqlx = { workspace = true }
tempfile = { workspace = true }
# Attachment CRUD contract tests base64-encode fixture payloads before feeding
# them through the facade (1-1-3-2).
base64 = { workspace = true }
# Slice #110-h T6 (resolved): `serial_test` is no longer needed.
# `LibsqlEngine::init_schema` now serializes itself via the process-wide
# `SCHEMA_INIT_LOCK` (see `src/libsql.rs`), so libsql integration tests run
# fully in parallel. The cold-start `PRAGMA foreign_keys` FFI race was
# eliminated by holding the lock across `self.conn().await` as well — see
# `tests/libsql_init_schema_flake_reproduce.rs` for the 100x guard.
pg-embed = { workspace = true }
