[workspace]
resolver = "2"
members = [
    "crates/zbrain-core",
    "crates/zbrain-cli",
    "crates/zbrain-web",
    "crates/zbrain-mcp",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
authors = ["zbrain contributors"]
license = "MIT"
repository = "https://github.com/jununfly/zbrain"
rust-version = "1.88"  # MSRV — bumped from 1.82 for pg-embed v1.0 (built/tested on stable, currently 1.95.x).

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pragmatic exclusions for early scaffolding; tighten later as code stabilizes.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
# Re-exported by member crates as `{ workspace = true }`.
# Versions kept conservative and bumped when needed.
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tracing = "0.1"
async-trait = "0.1"
# Slice 4a: PostgreSQL engine. `runtime-tokio-rustls` avoids OpenSSL system
# linkage (cross-platform reproducibility). `migrate` ships the embedded-
# migrations API used by PostgresEngine::init_schema.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "macros",
    "migrate",
    "chrono",
    "json",
] }
# Slice 5: libsql embedded SQLite engine. Local-file mode (no replication /
# remote sync features needed for the embedded engine variant). Replaces the
# TS PGLite WASM-Postgres choice with a native pure-Rust SQLite driver.
libsql = "0.9"
tempfile = "3"
# Slice #110-g: force PG integration tests to run serially. Cargo's default
# multi-threaded test runner races on the shared `pages` table (TRUNCATE vs
# INSERT from sibling tests), causing flaky CI. `#[serial]` enforces a global
# mutex so only one PG test runs at a time. libsql tests are not annotated —
# each test owns its own in-memory database, so no cross-test contention.
serial_test = "3"
# Slice #110-pg-embed (A-1): ephemeral PostgreSQL fixture for integration
# tests. `rt_tokio_migrate` enables `create_database`/`drop_database`/`migrate`
# helpers on top of `rt_tokio`. Inherited by member crates as a dev-dep via
# `pg-embed = { workspace = true }` under their `[dev-dependencies]`.
pg-embed = { version = "1.0", features = ["rt_tokio_migrate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
