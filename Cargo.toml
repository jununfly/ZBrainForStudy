[workspace]
resolver = "2"
members = [
    "crates/zbrain-core",
    "crates/zbrain-cli",
    "crates/zbrain-web",
    "crates/zbrain-mcp",
    "crates/zbrain-svg",
    "crates/zbrain-chunking",
    "crates/zbrain-worker",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
authors = ["zbrain contributors"]
license = "MIT"
repository = "https://github.com/jununfly/ZBrain"
rust-version = "1.88"  # MSRV — bumped from 1.82 for pg-embed v1.0 (built/tested on stable, currently 1.95.x).

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pragmatic exclusions for early scaffolding; tighten later as code stabilizes.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
# Re-exported by member crates as `{ workspace = true }`.
# Versions kept conservative and bumped when needed.
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "process"] }
url = { version = "2", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
# Promoted to a direct workspace dependency for ISO-8601 week-number math
# (audit-file rotation) and time-window filtering. Already pulled into the
# tree transitively via sqlx's `chrono` feature, so this adds no new compile
# cost. `default-features = false` + `clock` gives `Utc::now()` and the
# `%G-W%V` formatting without the (default) `oldtime`/`wasmbind` extras.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Slice 4a: PostgreSQL engine. `runtime-tokio-rustls` avoids OpenSSL system
# linkage (cross-platform reproducibility). `migrate` ships the embedded-
# migrations API used by PostgresEngine::init_schema.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "macros",
    "migrate",
    "chrono",
    "json",
] }
# Slice 5: libsql embedded SQLite engine. Local-file mode (no replication /
# remote sync features needed for the embedded engine variant). Replaces the
# TS PGLite WASM-Postgres choice with a native pure-Rust SQLite driver.
libsql = "0.9"
tempfile = "3"
# Slice #110-pg-embed (A-1): ephemeral PostgreSQL fixture for integration
# tests. `rt_tokio_migrate` enables `create_database`/`drop_database`/`migrate`
# helpers on top of `rt_tokio`. Inherited by member crates as a dev-dep via
# `pg-embed = { workspace = true }` under their `[dev-dependencies]`.
pg-embed = { version = "1.0", features = ["rt_tokio_migrate"] }
# Slice #41: Params validation. `garde` is a lightweight, trait-based validation
# library with derive support. Zero extra dependencies beyond serde.
garde = { version = "0.21", features = ["derive"] }
# Slice #41: Cross-platform path diffing for upload validation.
pathdiff = "0.2"
# Slice #58: Real LLM client for Think operation
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls-native-roots"] }
# OAuth client management: UUID generation for client_id, SHA-256 for secret hashing.
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
erased-serde = "0.4"
# Base64 decode for attachment content ingestion (minion attachment CRUD).
base64 = "0.22"
# Webhook HMAC-SHA256 verification
hmac = "0.12"
hex = "0.4"
# Constant-time comparison for HMAC verification
subtle = "2.6"
# YAML frontmatter parsing for capture pipeline
serde_yaml = "0.9"
# Unicode NFKC normalization for content hash
unicode-normalization = "0.1"
# Tree-sitter for code semantic chunking
tree-sitter = "0.26"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-rust = "0.24"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
