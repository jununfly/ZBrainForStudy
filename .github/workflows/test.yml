name: Test

# Legacy TypeScript CI (cache-check / verify / sharded test matrix / serial /
# slow-eval / slow-perf jobs) was retired 2026-08-08 alongside the GBrain
# script suite in scripts/. Rust test coverage now lives in rust-tests.yml
# (cargo test on Linux with libsql FFI flake retry). This workflow is kept as a
# lightweight cargo smoke gate so the "Test" name still maps to a real job.
#
# Does NOT reference any deleted scripts/ file.

on:
  push:
    branches: [master, rust-rewrite]
  pull_request:
    branches: [master, rust-rewrite]

permissions:
  contents: read

jobs:
  cargo-smoke:
    name: cargo build + lib test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-smoke-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-smoke-${{ runner.os }}-
      - name: cargo build --workspace
        run: cargo build --workspace
      - name: cargo test --lib (zbrain-core)
        run: cargo test -p zbrain-core --lib
