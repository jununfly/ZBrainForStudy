name: Rust Tests

# Runs the Rust (cargo test) suite that covers the TS→Rust migration crates.
# Historically UNCOVERED in CI — the other workflows only run `bun test`
# (TypeScript) and `cargo build --release`; no `cargo test` ran anywhere.
#
# Why ubuntu-latest (Linux) and not windows-latest:
#   The libsql native FFI has an intermittent crash (STATUS_ACCESS_VIOLATION /
#   segfault, exit 0xc0000005) on Windows under parallel `cargo test` that
#   CANNOT be fixed in code. Verified empirically (4 groups × 3 runs each):
#     - body-level mutex serializing each binary's tests → still crashes
#     - #[tokio::test(flavor = "current_thread")] → still crashes
#     - --test-threads=1 (single OS thread) → still crashes (2/3)
#     - leaking the temp DB file (no delete race) → still crashes (2/3)
#   Root cause is the libsql/SQLite native library on Windows itself. Running
#   on Linux sidesteps it entirely (Linux does not exhibit the crash).
#
# Retry guard (defense-in-depth): even on Linux a transient crash could
# theoretically occur, so the run is wrapped in a max-3 retry loop. A real
# failure still surfaces after the retries; flakiness is absorbed.
#
# Scope: libsql-backed integration tests + the crate's lib unit tests. The
# postgres-backed tests (pg-embed) are intentionally excluded — they have
# their own environment requirements and are out of scope for this flake fix.
#
# `eol-check` job (org-level CRLF/LF invariant enforcement): mirrors the
# .gitattributes contract so a PR that flips lib.rs to LF (or any other file
# whose canonical line ending is fixed) goes red *before* merge. Pairs with
# .gitattributes (the authoritative enforcement) to catch things the
# attribute alone can't — e.g. files not listed in .gitattributes that end
# up with mixed EOL, or pre-existing violations that survived a re-clone.
# Runs on Linux because git's CRLF behavior is platform-dependent and we
# want one canonical check.

on:
  push:
    branches: [master, rust-rewrite]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.gitattributes'
      - '.github/workflows/**'
      - 'docs/**'
  pull_request:
    branches: [master, rust-rewrite]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.gitattributes'
      - '.github/workflows/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eol-check:
    name: EOL invariant (lib.rs=CRLF, no mixed)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install git (CRLF probing)
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq git >/dev/null

      - name: Assert lib.rs is CRLF (per .gitattributes text eol=crlf)
        run: |
          set -euo pipefail
          # git ls-files --eol prints 5 tab-separated fields:
          #   <i_eol> <w_eol> <attr/text=auto> <attr_key=val>... <path>
          # Our contract from .gitattributes (`text eol=crlf`) is:
          #   worktree MUST be CRLF (w/crlf) and the `eol=crlf` attr
          #   MUST be present. Index storage is intentionally LF.
          EOL="$(git ls-files --eol crates/zbrain-cli/src/lib.rs)"
          echo "EOL: $EOL"
          if ! echo "$EOL" | grep -q 'w/crlf'; then
            echo "::error::lib.rs worktree is not CRLF (.gitattributes says text eol=crlf). Got: $EOL"
            exit 1
          fi
          if ! echo "$EOL" | grep -q 'eol=crlf'; then
            echo "::error::lib.rs is missing the eol=crlf attribute. Re-apply .gitattributes. Got: $EOL"
            exit 1
          fi

      - name: Assert no file is mixed EOL (mixed = index LF but worktree CRLF or vice versa)
        run: |
          set -euo pipefail
          # `git ls-files --eol` flags an `i/lf w/crlf` mismatch when a file
          # is *stored* as LF but *checked out* as CRLF. For our repo the
          # inverse (i/crlf w/lf) and any i/mixed/w/mixed are also violations.
          # We exclude .git itself (no entries) and binary files (git shows
          # `-` for non-text EOL).
          BAD="$(git ls-files --eol \
                  | grep -E 'i/(crlf|mixed)/.*w/(lf|mixed)/' \
                  || true)"
          if [ -n "$BAD" ]; then
            echo "::error::The following tracked files have mismatched index/worktree EOL:"
            echo "$BAD"
            exit 1
          fi

      - name: Assert no .rs file (other than lib.rs) contains CR bytes in HEAD
        run: |
          set -euo pipefail
          # Convention: every crate's `lib.rs` is the entry point and has the
          # Windows CRLF contract; all other .rs files must be pure LF. We
          # check the *index* (HEAD) for CR bytes across all non-lib .rs
          # files in a single `git cat-file --batch` pass.
          # Note: all 7 `lib.rs` are CRLF by convention (the 6 non-cli ones
          # are CRLF via git's text=auto behavior on Windows checkouts); if
          # a non-lib .rs has any CR byte, that is the leak.
          git ls-files '*.rs' | grep -v '/lib\.rs$' > /tmp/_rs.txt
          COUNT=$(wc -l < /tmp/_rs.txt)
          # git cat-file --batch output records of the form:
          #   <40-hex-sha> <size>\n
          #   <content of exactly that size>\n
          # Strip the header lines (40 hex chars + space + digits) by
          # keeping only lines that do NOT match the header pattern.
          git ls-tree HEAD -- $(cat /tmp/_rs.txt) \
            | awk '{print $3}' \
            | git cat-file --batch \
            | grep -vE '^[0-9a-f]{40} [0-9]+$' \
            > /tmp/_rs.blobs
          CR=$(tr -dc '\r' < /tmp/_rs.blobs | wc -c)
          rm -f /tmp/_rs.txt /tmp/_rs.blobs
          if [ "$CR" -ne 0 ]; then
            echo "::error::Found $CR CR bytes across $COUNT non-lib .rs files in HEAD"
            exit 1
          fi
          echo "OK: $COUNT non-lib .rs files, 0 CR bytes"

  cargo-test:
    name: cargo test (zbrain-core, Linux + retry)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: eol-check
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Run cargo test (libsql targets) with flake retry
        run: |
          # Collect integration-test binaries that exercise LibsqlEngine — the
          # flaky FFI surface. Postgres-backed tests (pg-embed) are excluded:
          # they are run per-target with `--skip postgres` because pg-embed is
          # not available on the runner and would otherwise turn CI red.
          # Running each target separately (instead of one combined
          # `cargo test --lib --test T1 ... --test T52`) also avoids cross-target
          # state bleed between the serial libsql FFI lock holders.
          mapfile -t TESTS < <(grep -rl "LibsqlEngine" crates/zbrain-core/tests --include=*.rs | sed 's#.*/##; s#\.rs$##')
          echo "Libsql-backed test targets (${#TESTS[@]}): ${TESTS[*]}"

          run_with_retry() {
            local desc="$1"; shift
            local MAX=3
            for i in $(seq 1 "$MAX"); do
              echo "::group::$desc (attempt $i/$MAX)"
              if "$@"; then
                echo "::endgroup::"
                echo "✓ $desc passed on attempt $i"
                return 0
              fi
              echo "::endgroup::"
              echo "⚠️ $desc attempt $i failed"
              if [ "$i" -lt "$MAX" ]; then sleep 3; fi
            done
            echo "✗ $desc failed after $MAX attempts"
            return 1
          }

          # 1) lib unit tests (own retry guard)
          if ! run_with_retry "cargo test --lib" cargo test -p zbrain-core --lib; then
            echo "lib unit tests failed"
            exit 1
          fi

          # 2) each integration target separately, skipping postgres-backed tests
          STATUS=0
          for t in "${TESTS[@]}"; do
            if ! run_with_retry "cargo test --test $t" \
                 cargo test -p zbrain-core --test "$t" -- --skip postgres; then
              STATUS=1
            fi
          done
          if [ "$STATUS" -ne 0 ]; then
            echo "✗ one or more integration targets failed"
            exit 1
          fi
          echo "✓ all cargo tests passed"
