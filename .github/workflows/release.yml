name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p zbrain-cli
      - name: Stage artifact
        shell: bash
        run: |
          bin_name="zbrain"
          [ "${{ runner.os }}" = "Windows" ] && bin_name="zbrain.exe"
          out="zbrain-${{ matrix.target }}"
          [ "${{ runner.os }}" = "Windows" ] && out="${out}.exe"
          cp "target/${{ matrix.target }}/release/${bin_name}" "${out}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: zbrain-${{ matrix.target }}
          path: zbrain-${{ matrix.target }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe  # v2
        with:
          files: |
            artifacts/zbrain-aarch64-apple-darwin/zbrain-aarch64-apple-darwin
            artifacts/zbrain-x86_64-apple-darwin/zbrain-x86_64-apple-darwin
            artifacts/zbrain-x86_64-unknown-linux-gnu/zbrain-x86_64-unknown-linux-gnu
            artifacts/zbrain-x86_64-pc-windows-msvc/zbrain-x86_64-pc-windows-msvc.exe
          generate_release_notes: true
